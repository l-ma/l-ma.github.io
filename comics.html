  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f9;
      margin: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
    }

    .comic-gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 20px;
    }

    .comic-item {
      background-color: white;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 10px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      width: 100%;
      margin: 0;
      font: inherit;
      color: inherit;
      cursor: zoom-in;
      appearance: none;
    }

    .comic-item:focus-visible {
      outline: 2px solid #555;
      outline-offset: 2px;
    }

    .comic-item img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    /* Layout adjustment based on orientation */
    .comic-item.landscape {
      grid-column: span 2;
    }

    .comic-item.portrait {
      grid-column: span 1;
    }

    .page-title {
  text-align: center;
  color: #555;
  margin-bottom: 5px;
}

.back-text {
  text-align: center;
  font-size: 0.8rem;
  margin-top: 0;
  margin-bottom: 20px;
}

.back-text a {
  color: #555;
  text-decoration: none;
  font-weight: normal;
}

.back-text a:hover {
  text-decoration: underline;
}

    .back-link {
      display: block;
      text-align: center;
      margin-top: 40px;
      font-size: 0.9em;
      color: #666;
      text-decoration: none;
    }

    .back-link:hover {
      text-decoration: underline;
    }

    #comic-viewer {
      border: none;
      padding: 0;
      background: transparent;
      max-width: 94vw;
      max-height: 94vh;
    }

    #comic-viewer::backdrop {
      background: rgba(20, 20, 28, 0.86);
    }

    .comic-viewer-frame {
      position: relative;
    }

    #comic-viewer img {
      display: block;
      max-width: 92vw;
      max-height: 88vh;
      width: auto;
      height: auto;
      object-fit: contain;
      background: #fff;
      border-radius: 4px;
    }

    .comic-viewer-close {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 36px;
      height: 36px;
      border: none;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      font-size: 24px;
      line-height: 1;
      cursor: pointer;
    }

    .comic-viewer-close:focus-visible {
      outline: 2px solid #fff;
      outline-offset: 2px;
    }
  </style>
</head>

  <dialog id="comic-viewer">
    <div class="comic-viewer-frame">
      <button type="button" class="comic-viewer-close" aria-label="Close">&times;</button>
      <img id="comic-viewer-img" alt="">
    </div>
  </dialog>

  <script>
    const viewer = document.getElementById("comic-viewer");
    const viewerImg = document.getElementById("comic-viewer-img");

    function openComic(img) {
      viewerImg.src = img.currentSrc || img.src;
      viewerImg.alt = img.alt;
      viewer.showModal();
    }

    function closeComic() {
      viewer.close();
      viewerImg.removeAttribute("src");
    }

    // Add orientation-based classes to each image and open a larger view on click
    window.addEventListener("load", () => {
      const items = document.querySelectorAll(".comic-item img");

      items.forEach(img => {
        const parent = img.parentElement;
        const tempImg = new Image();
        tempImg.src = img.src;

        tempImg.onload = () => {
          const aspect = tempImg.width / tempImg.height;
          if (aspect >= 1.2) {
            parent.classList.add("landscape");
          } else {
            parent.classList.add("portrait");
          }
        };

        parent.addEventListener("click", () => openComic(img));
      });
    });

    viewer.querySelector(".comic-viewer-close").addEventListener("click", (event) => {
      event.stopPropagation();
      closeComic();
    });

    viewer.addEventListener("click", (event) => {
      if (event.target === viewer) closeComic();
    });

    viewer.addEventListener("close", () => {
      viewerImg.removeAttribute("src");
    });
  </script>
